<script>
    // Dicionário para armazenar os serviços de CADA obra pelo seu ID
    let localObras = [
        { id: 'demo1', name: 'Residencial Boulevard', category: 'Residencial', progress: 64 },
        { id: 'demo2', name: 'Centro Comercial Alpha', category: 'Comercial', progress: 0 }
    ];

    // Serviços vinculados especificamente por ID da obra
    let localServicosPorObra = {
        'demo1': [
            { id: 's1', name: 'Alvenaria Estrutural', category: 'Alvenaria', meta: 350, executada: 230 },
            { id: 's2', name: 'Concretagem de Pilares', category: 'Estrutura', meta: 280, executada: 150 },
            { id: 's3', name: 'Instalação Hidráulica', category: 'Hidráulica', meta: 150, executada: 95 }
        ]
        // Novas obras (como a sua obra 'Teste') entram em branco por padrão!
    };

    let localHistorico = {};

    const app = {
        currentObra: null,
        currentServico: null,

        init() {
            this.setDataToday();
            this.renderObras(localObras);
        },

        setDataToday() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('medicao-data').value = today;
        },

        renderObras(obras) {
            const list = document.getElementById('obras-list');
            if (!obras.length) {
                list.innerHTML = '<div class="card"><p style="text-align: center; color: var(--text-muted);">Nenhuma obra cadastrada.</p></div>';
                return;
            }

            list.innerHTML = obras.map(obra => `
                <div class="card" onclick="app.selectObra('${obra.id}', '${obra.name}')" style="cursor: pointer;">
                    <h3 class="card-title">${obra.name}</h3>
                    <span class="badge">${obra.category}</span>
                    <div style="margin-top: 12px; display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 11px; color: var(--text-muted);">Progresso Geral</span>
                        <span style="font-size: 13px; font-weight: 700; color: var(--primary);">${obra.progress || 0}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${obra.progress || 0}%;"></div>
                    </div>
                </div>
            `).join('');
        },

        selectObra(id, name) {
            this.currentObra = { id, name };
            document.getElementById('obra-title').textContent = name;
            document.getElementById('obra-card-title').textContent = name;

            // Garante que existe uma lista de serviços (mesmo que vazia) para essa obra
            if (!localServicosPorObra[id]) {
                localServicosPorObra[id] = [];
            }

            this.renderServicos(localServicosPorObra[id]);
            this.recalcularProgressoObra(id);
            this.showScreen('screen-obra');
        },

        renderServicos(servicos) {
            const container = document.getElementById('servicos-content');
            
            if (!servicos || servicos.length === 0) {
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 24px 16px;">
                        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 12px;">Nenhum serviço cadastrado nesta obra.</p>
                        <button class="btn-primary" style="padding: 8px 16px; font-size: 12px;" onclick="app.openNovoServicoModal()">+ Adicionar Serviço</button>
                    </div>
                `;
                return;
            }

            const getCategoryClass = (category) => {
                const cat = (category || '').toLowerCase();
                if (cat.includes('alvenaria')) return 'cat-alvenaria';
                if (cat.includes('estrutura')) return 'cat-estrutura';
                if (cat.includes('hidráulica') || cat.includes('hidraulica')) return 'cat-hidraulica';
                if (cat.includes('elétrica') || cat.includes('eletrica')) return 'cat-eletrica';
                if (cat.includes('acabamento')) return 'cat-acabamento';
                return '';
            };

            const htmlServicos = servicos.map(s => {
                const pct = s.meta > 0 ? Math.min(100, Math.round((s.executada / s.meta) * 100)) : 0;
                const categoryClass = getCategoryClass(s.category);
                return `
                    <div class="card">
                        <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 6px;">${s.name}</h4>
                        <span class="badge ${categoryClass}">${s.category}</span>
                        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 10px;">
                            <span>Meta: ${s.meta} m²</span>
                            <span>Executado: ${s.executada} m²</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${pct}%;"></div>
                        </div>
                        <div class="action-buttons">
                            <button onclick="app.openMedicaoModal('${s.id}', '${s.name}', ${s.meta}, ${s.executada})">📏 Medir</button>
                            <button onclick="app.openHistorico('${s.id}')">📋 Histórico</button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = htmlServicos + `
                <button class="btn-secondary" style="width: 100%; margin-top: 8px;" onclick="app.openNovoServicoModal()">+ Adicionar Outro Serviço</button>
            `;
        },

        recalcularProgressoObra(obraId) {
            const servicos = localServicosPorObra[obraId] || [];
            let percentualGeral = 0;

            if (servicos.length > 0) {
                const totalMeta = servicos.reduce((acc, s) => acc + (s.meta || 0), 0);
                const totalExecutado = servicos.reduce((acc, s) => acc + (s.executada || 0), 0);
                percentualGeral = totalMeta > 0 ? Math.min(100, Math.round((totalExecutado / totalMeta) * 100)) : 0;
            }

            // Atualiza na tela
            document.getElementById('obra-progress').textContent = percentualGeral + '%';
            document.getElementById('obra-progress-bar').style.width = percentualGeral + '%';

            // Atualiza no objeto da obra
            const obra = localObras.find(o => o.id === obraId);
            if (obra) obra.progress = percentualGeral;
        },

        onQuantidadeChange() {
            const input = document.getElementById('medicao-quantidade');
            if (!input || !this.currentServico) return;
            
            const qtdDigitada = parseFloat(input.value) || 0;
            const meta = this.currentServico.meta;
            const executada = this.currentServico.executada;

            const extrapolado = (executada + qtdDigitada > meta) || (qtdDigitada > meta);

            const alertBox = document.getElementById('medicao-alert');
            const groupJustificativa = document.getElementById('medicao-justificativa-group');

            if (extrapolado) {
                alertBox.classList.remove('hidden');
                groupJustificativa.classList.remove('hidden');
            } else {
                alertBox.classList.add('hidden');
                groupJustificativa.classList.add('hidden');
            }
        },

        openMedicaoModal(servicoId, servicoName, meta, executada) {
            this.currentServico = { id: servicoId, name: servicoName, meta, executada };
            const pct = meta > 0 ? Math.round((executada / meta) * 100) : 0;
            
            document.getElementById('medicao-info').innerHTML = `
                <strong>${servicoName}</strong><br>
                Meta: ${meta} m² | Executado Atual: ${executada} m² (${pct}%)
            `;
            document.getElementById('medicao-quantidade').value = '';
            document.getElementById('medicao-justificativa').value = '';
            document.getElementById('medicao-alert').classList.add('hidden');
            document.getElementById('medicao-justificativa-group').classList.add('hidden');
            document.getElementById('modal-medicao').classList.remove('hidden');
        },

        closeMedicaoModal() {
            document.getElementById('modal-medicao').classList.add('hidden');
        },

        salvarMedicao() {
            const qtd = parseFloat(document.getElementById('medicao-quantidade').value);
            if (!qtd || qtd <= 0) {
                alert('Informe uma quantidade válida.');
                return;
            }

            const extrapolou = (this.currentServico.executada + qtd > this.currentServico.meta) || (qtd > this.currentServico.meta);
            const justificativa = document.getElementById('medicao-justificativa').value;

            if (extrapolou && !justificativa.trim()) {
                alert('A meta foi excedida! É obrigatório preencher a justificativa.');
                return;
            }

            const servicos = localServicosPorObra[this.currentObra.id];
            const s = servicos.find(item => item.id === this.currentServico.id);
            if (s) {
                s.executada += qtd;
            }

            if (!localHistorico[this.currentServico.id]) {
                localHistorico[this.currentServico.id] = [];
            }

            localHistorico[this.currentServico.id].unshift({
                data: document.getElementById('medicao-data').value,
                quantidade: qtd,
                status: extrapolou ? 'extrapolou' : 'normal',
                justificativa: extrapolou ? justificativa : null
            });

            alert('✅ Medição registrada com sucesso!');
            this.closeMedicaoModal();
            this.renderServicos(servicos);
            this.recalcularProgressoObra(this.currentObra.id);
        },

        openNovoServicoModal() {
            const nome = prompt('Nome do serviço (ex: Pintura Interna):');
            if (!nome) return;

            const categoria = prompt('Categoria (ex: Acabamento, Alvenaria, Estrutura, Hidráulica):') || 'Geral';
            const meta = parseFloat(prompt('Meta total em m²:') || '0');

            const novoServico = {
                id: 'serv_' + Date.now(),
                name: nome,
                category: categoria,
                meta: meta,
                executada: 0
            };

            localServicosPorObra[this.currentObra.id].push(novoServico);
            this.renderServicos(localServicosPorObra[this.currentObra.id]);
            this.recalcularProgressoObra(this.currentObra.id);
        },

        openHistorico(servicoId) {
            this.currentServico = { id: servicoId };
            this.showScreen('screen-historico');
            this.loadHistorico();
        },

        loadHistorico() {
            const container = document.getElementById('historico-content');
            const list = localHistorico[this.currentServico.id] || [];

            if (!list.length) {
                container.innerHTML = '<div class="card"><p style="text-align: center; color: var(--text-muted);">Nenhuma medição cadastrada.</p></div>';
                return;
            }

            container.innerHTML = list.map(med => `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h4 style="font-size: 14px; font-weight: 600;">Data: ${med.data}</h4>
                            <p style="font-size: 15px; font-weight: 700; color: var(--primary); margin-top: 6px;">${med.quantidade} m²</p>
                        </div>
                        <span class="badge ${med.status === 'extrapolou' ? 'status-extrapolou' : 'status-normal'}">
                            ${med.status === 'extrapolou' ? 'Excedeu Meta' : 'Normal'}
                        </span>
                    </div>
                    ${med.justificativa ? `<p style="margin-top: 8px; font-size: 11px; color: var(--danger); background: #FEF2F2; padding: 6px; border-radius: 4px;"><strong>Justificativa:</strong> ${med.justificativa}</p>` : ''}
                </div>
            `).join('');
        },

        openNovaObraModal() {
            document.getElementById('modal-nova-obra').classList.remove('hidden');
        },

        closeNovaObraModal() {
            document.getElementById('modal-nova-obra').classList.add('hidden');
        },

        salvarNovaObra() {
            const nome = document.getElementById('nova-obra-nome').value;
            const categoria = document.getElementById('nova-obra-categoria').value;

            if (!nome || !categoria) {
                alert('Preencha os campos obrigatórios.');
                return;
            }

            const novaObra = {
                id: 'obra_' + Date.now(),
                name: nome,
                category: categoria,
                progress: 0
            };

            localObras.unshift(novaObra);
            localServicosPorObra[novaObra.id] = []; // Inicia com lista em branco
            
            this.renderObras(localObras);
            
            document.getElementById('nova-obra-nome').value = '';
            document.getElementById('nova-obra-categoria').value = '';
            
            this.closeNovaObraModal();
            this.selectObra(novaObra.id, novaObra.name); // Já abre a nova obra diretamente
        },

        switchTab(tab, e) {
            document.querySelectorAll('#screen-obra .tab-button').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById('servicos-content').classList.toggle('hidden', tab !== 'servicos');
            document.getElementById('graficos-content').classList.toggle('hidden', tab !== 'graficos');
        },

        goHome() { this.showScreen('screen-home'); },
        goToObra() { if (this.currentObra) this.showScreen('screen-obra'); },

        showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    };

    app.init();
</script>
